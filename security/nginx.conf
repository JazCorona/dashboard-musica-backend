# Nginx al frente del backend. Es el ÚNICO punto expuesto en el puerto público
# (8001). Reenvía al uvicorn que corre en loopback (127.0.0.1:9001) y escribe
# un access.log en formato combined que Fail2Ban vigila para detectar floods.
worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  # combined empieza con "$remote_addr - ..." que es justo lo que espera el
  # failregex de Fail2Ban (^<HOST> -).
  access_log /var/log/nginx/access.log combined;
  sendfile on;

  upstream app_backend { server 127.0.0.1:9001; }

  server {
    listen 8001;
    server_name _;

    location / {
      proxy_pass http://app_backend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
